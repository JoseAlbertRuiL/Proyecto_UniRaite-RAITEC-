name: Backend Integration Tests

on:
  push:
    branches:
      - RamaCompleta
      - PPTSIS
      - RamaSebastian
  pull_request:
    branches:
      - RamaCompleta
      - PPTSIS
      - RamaSebastian

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uniraite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uniraite_test?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install

      - name: Generar Prisma Client
        run: pnpm prisma generate

      - name: Sincronizar esquema de base de datos
        run: pnpm prisma db push --skip-generate

      - name: Ejecutar tests
        run: pnpm test -- --run
